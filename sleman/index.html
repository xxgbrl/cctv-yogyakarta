<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  
  <title>CCTV Kabupaten Sleman – LIVE CCTV Yogyakarta</title>
  <link rel="icon" href="../favicon.ico" />
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
      content="Pantauan kamera CCTV publik wilayah Kabupaten Sleman secara real-time dari berbagai titik jalan, fasilitas umum, dan area publik." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://cctvjogja.pages.dev/sleman/" />

  <!-- HLS -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* =====================
       BASE STYLE
    ===================== */
    :root {
      --bg:        #0f1419;
      --surface:   #171e27;
      --surface-2: #202a36;
      --border:    #2b3644;
      --text:      #f2f5f8;
      --muted:     #a3b0be;
      --accent:    #e3b55f;
      --accent-ink:#1d1403;
      --ok:        #34d399;
      --bad:       #ef4444;
      --shadow:    0 6px 24px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg:        #f6f4ef;
        --surface:   #ffffff;
        --surface-2: #efebe2;
        --border:    #ddd7ca;
        --text:      #1c1917;
        --muted:     #5b564d;
        --accent:    #8f5f06;
        --accent-ink:#ffffff;
        --ok:        #059669;
        --bad:       #dc2626;
        --shadow:    0 6px 20px rgba(60, 40, 0, .10);
        color-scheme: light;
      }
    }

    * { box-sizing: border-box; }

    html { font-size: 17px; -webkit-text-size-adjust: 100%; }

    a { color: inherit; }
    button { font: inherit; }

    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.45;
      display: flex;
      height: 100vh;
      height: 100dvh;
    }

    video { width: 100%; height: 100%; background: #000; object-fit: contain; color-scheme: dark; }

    /* =====================
       SIDEBAR
    ===================== */
    .sidebar {
      width: 380px;
      flex: none;
      min-height: 0;
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      margin: 0;
      padding: 16px 16px 6px;
      font-size: 1.2rem;
      letter-spacing: .02em;
      text-align: center;
    }

    .sidebar-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .back-home {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: .95rem;
      min-height: 46px;
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .back-home:hover { background: var(--surface-2); }

    #camList {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cam-btn {
      flex-shrink: 0;
      min-height: 58px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-weight: 600;
      line-height: 1.3;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background 0.12s, border-color 0.12s;
    }

    .cam-btn:hover  { background: var(--surface-2); }
    .cam-btn.active { background: var(--surface-2); border-color: var(--accent); }

    .cam-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #7b8794;
      animation: pulse 1.4s ease-in-out infinite;
      transition: background 0.3s;
    }

    .status-dot.online  { background: var(--ok); animation: none; box-shadow: 0 0 0 4px rgba(52, 211, 153, .2); }
    .status-dot.offline { background: var(--bad); animation: none; box-shadow: 0 0 0 4px rgba(239, 68, 68, .2); }

    /* =====================
       SEARCH
    ===================== */
    .search-box {
      padding: 10px 14px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    #searchBox {
      flex: 1;
      min-width: 0;
      height: 52px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    #searchBox::placeholder { color: var(--muted); }
    #searchBox:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(227, 181, 95, .28); }

    #clearSearch {
      width: 52px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    #clearSearch:hover { background: var(--surface-2); }

    /* =====================
       PLAYER
    ===================== */
    .player {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .player-title {
      min-height: 66px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 1.15rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .player-title #playerTitle { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .player-body {
      flex: 1;
      min-height: 0;
      margin: 20px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .placeholder {
      color: #9aa7b5;
      font-size: 1.1rem;
      text-align: center;
      padding: 24px;
    }

    #closeBtn {
      min-width: 48px;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      display: none;
    }

    #closeBtn:hover { background: var(--bad); border-color: var(--bad); color: #fff; }

    /* =====================
       MOBILE MODE
    ===================== */
    @media (max-width: 768px) {
      body { flex-direction: column; }

      .sidebar {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        border-right: none;
      }

      .player {
        position: fixed;
        inset: 0;
        background: #000;
        color: #fff;
        z-index: 999;
        display: none;
      }

      .player.active { display: flex; }

      .player-title { background: #0f1419; border-bottom-color: #2b3644; }
      #closeBtn { background: #202a36; border-color: #2b3644; }
      .player-body { margin: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <a href="../" class="back-home">⇐ Kembali ke Beranda</a>
    </div>
    <h2>DAFTAR CCTV</h2>

    <!-- SEARCH -->
    <div class="search-box">
      <input
        id="searchBox"
        type="text"
        placeholder="🔍 Cari kamera..."
      />
      <button
        id="clearSearch"
        title="Clear"
        style="display:none"
      >✖</button>
    </div>

    <div id="camList"></div>
  </div>

  <!-- PLAYER -->
  <div class="player">
    <div class="player-title">
      <span id="playerTitle">Pilih kamera</span>
      <button id="closeBtn" onclick="closePlayer()">✖</button>
    </div>
    <div class="player-body" id="playerBody">
      <div class="placeholder">📷 Klik nama kamera</div>
    </div>
  </div>

<script>
/* =============================
   DATA CCTV
============================= */
const cameras = [
  { name: "Perempatan Godean Arah Selatan", url: "https://ant.slemankab.go.id/CCTVLUARPEMDA/streams/524559704910938140590513.m3u8" },
  { name: "Pertigaan UIN", url: "https://ant.slemankab.go.id/CCTVLUARPEMDA/streams/032278190806133512572736.m3u8" },
  { name: "Amplaz Arah Timur", url: "https://ant.slemankab.go.id/CCTVLUARPEMDA/streams/624286194033618649155563.m3u8" },
  { name: "Pospol Jombor", url: "https://ant.slemankab.go.id/CCTVLUARPEMDA/streams/245993371803374753849150.m3u8" },
  { name: "Pelemgurih 1", url: "https://ant.slemankab.go.id/CCTVLUARPEMDA/streams/710715987663948483731029.m3u8" },
  { name: "Pertigaan Maguwo 1", url: "https://ant.slemankab.go.id/CCTVLUARPEMDA/streams/206298812007526786499421.m3u8" },
  { name: "Jembatan Krasak Arah Magelang", url: "https://ant.slemankab.go.id/CCTVLUARPEMDA/streams/964709525328892941170893.m3u8" },
  { name: "Prambanan Arah Klaten 1", url: "https://ant.slemankab.go.id/CCTVLUARPEMDA/streams/294652610113860954611144.m3u8" },
  { name: "Jembatan Krasak Arah Jogja", url: "https://ant.slemankab.go.id/CCTVLUARPEMDA/streams/162174530279439010500716.m3u8" },
];

/* =============================
   SORT A-Z
============================= */
cameras.sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));

/* =============================
   ELEMENT REFERENCES
============================= */
const camList     = document.getElementById("camList");
const playerBody  = document.getElementById("playerBody");
const playerTitle = document.getElementById("playerTitle");
const searchBox   = document.getElementById("searchBox");
const clearBtn    = document.getElementById("clearSearch");

let hls = null;
let activeBtn = null;
let currentCameraId = 0;
const dotMap = {};

/* =============================
   STATUS CHECK
============================= */
async function checkStatus(cam) {
  try {
    const res = await fetch(cam.url, { method: "HEAD", cache: "no-store" });
    return res.ok;
  } catch {
    return false;
  }
}

async function checkAllStatuses() {
  await Promise.all(cameras.map(async cam => {
    const online = await checkStatus(cam);
    const dot = dotMap[cam.url];
    if (dot) {
      dot.classList.remove("online", "offline");
      dot.classList.add(online ? "online" : "offline");
      dot.title = online ? "Kamera aktif" : "Kamera tidak aktif";
    }
  }));
}

/* =============================
   PLAYER CONTROLS
============================= */
function stopPlayer() {
  if (hls) { hls.destroy(); hls = null; }
  playerBody.innerHTML = '<div class="placeholder">📷 Klik nama kamera</div>';
}

function playCamera(cam, btn) {
  const cameraId = ++currentCameraId;
  if (activeBtn) activeBtn.classList.remove("active");
  btn.classList.add("active");
  activeBtn = btn;
  stopPlayer();
  playerTitle.textContent = cam.name;
  document.querySelector(".player").classList.add("active");
  document.getElementById("closeBtn").style.display = "inline-block";

  const video = document.createElement("video");
  video.autoplay = true;
  video.muted = true;
  video.controls = true;
  video.playsInline = true;
  playerBody.innerHTML = "";
  playerBody.appendChild(video);

  if (Hls.isSupported()) {
    hls = new Hls({ lowLatencyMode: true, maxBufferLength: 10 });
    hls.loadSource(cam.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, (e, d) => {
      if (cameraId !== currentCameraId) return;
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
        hls.recoverMediaError();
      } else {
        setTimeout(() => { if (cameraId === currentCameraId) playCamera(cam, btn); }, 3000);
      }
    });
  } else {
    video.src = cam.url;
  }
}

function closePlayer() {
  currentCameraId++;
  if (hls) { hls.destroy(); hls = null; }
  if (activeBtn) { activeBtn.classList.remove("active"); activeBtn = null; }
  playerTitle.textContent = "Pilih kamera";
  document.getElementById("closeBtn").style.display = "none";
  document.querySelector(".player").classList.remove("active");
  playerBody.innerHTML = '<div class="placeholder">📷 Klik nama kamera di kiri</div>';
}

/* =============================
   RENDER LIST
============================= */
function renderCameraList(list) {
  camList.innerHTML = "";
  list.forEach(cam => {
    const btn = document.createElement("div");
    btn.className = "cam-btn";

    const nameSpan = document.createElement("span");
    nameSpan.className = "cam-name";
    nameSpan.textContent = cam.name;

    const dot = document.createElement("span");
    dot.className = "status-dot";
    dot.title = "Mengecek...";
    dotMap[cam.url] = dot;

    btn.appendChild(nameSpan);
    btn.appendChild(dot);
    btn.onclick = () => playCamera(cam, btn);
    camList.appendChild(btn);
  });
}

renderCameraList(cameras);
checkAllStatuses();
setInterval(checkAllStatuses, 30 * 1000);

/* =============================
   SEARCH HANDLER
============================= */
let searchDebounce = null;
searchBox.addEventListener("input", e => {
  const q = e.target.value.toLowerCase();
  clearBtn.style.display = q ? "block" : "none";
  renderCameraList(cameras.filter(cam => cam.name.toLowerCase().includes(q)));
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => checkAllStatuses(), 300);
});

clearBtn.addEventListener("click", () => {
  searchBox.value = "";
  clearBtn.style.display = "none";
  renderCameraList(cameras);
  checkAllStatuses();
  searchBox.focus();
});
</script>

<script type="module">

  const app = initializeApp({

    authDomain:        "cctvjogja-1c5a8.firebaseapp.com",
    databaseURL:       "https://cctvjogja-1c5a8-default-rtdb.asia-southeast1.firebasedatabase.app",

    messagingSenderId: "962684380548",

</body>
</html>
